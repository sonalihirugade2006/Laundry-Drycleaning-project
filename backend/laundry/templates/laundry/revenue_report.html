
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Report | LaundryCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 25px;
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .report-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .label {
            font-weight: bold;
        }

        .amount {
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .report-row {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Revenue Report</h1>
        <p class="subtitle">LaundryCare Management System</p>

        <div class="report-row">
            <span class="label">Total Amount</span>
            <span class="amount">₹{{ total_amount|floatformat:2 }}</span>
        </div>

        <div class="report-row">
            <span class="label">Total Discount</span>
            <span class="amount">₹{{ total_discount|floatformat:2 }}</span>
        </div>

        <div class="report-row">
            <span class="label">Total Advance Received</span>
            <span class="amount">₹{{ total_advance|floatformat:2 }}</span>
        </div>

        <div class="report-row">
            <span class="label">Total Pending Amount</span>
            <span class="amount">₹{{ total_pending|floatformat:2 }}</span>
        </div>

        <a href="{% url 'dashboard' %}" class="back-link">
            &larr; Back to Dashboard
        </a>
    </div>
</body>
</html>
