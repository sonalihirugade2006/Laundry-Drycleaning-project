
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Report | LaundryCare</title>

    
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f0fdf4;
        margin: 0;
        padding: 35px 20px;
        color: #334155;
    }

    .container {
        width: 100%;
        max-width: 900px;
        margin: auto;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #d1fae5;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(6, 78, 59, 0.08);
    }

    h1 {
        text-align: center;
        color: #064e3b;
        font-size: 30px;
        font-weight: 800;
        margin: 0 0 10px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 15px;
        margin: 0 0 30px;
    }

    .report-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 20px 22px;
        margin-bottom: 16px;
        background: #f8fffb;
        border: 1px solid #d1fae5;
        border-left: 5px solid #059669;
        border-radius: 12px;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .report-row:hover {
        background: #ecfdf5;
        transform: translateY(-2px);
    }

    .label {
        color: #475569;
        font-size: 15px;
        font-weight: 700;
    }

    .amount {
        color: #047857;
        font-size: 19px;
        font-weight: 800;
        text-align: right;
        overflow-wrap: anywhere;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        margin-top: 14px;
        padding: 12px 18px;
        background: #047857;
        color: #ffffff;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.2s ease;
    }

    .back-link:hover {
        background: #065f46;
    }

    @media (max-width: 600px) {
        body {
            padding: 14px;
        }

        .container {
            padding: 20px 14px;
        }

        h1 {
            font-size: 25px;
        }

        .report-row {
            padding: 16px 12px;
            gap: 10px;
        }

        .label {
            font-size: 13px;
        }

        .amount {
            font-size: 16px;
        }
    }

    @media (max-width: 380px) {
        .report-row {
            align-items: flex-start;
            flex-direction: column;
        }

        .amount {
            text-align: left;
        }
    }
</style>

</head>

<body>
    <div class="container">
        <h1>Revenue Report</h1>
        <p class="subtitle">LaundryCare Management System</p>

        <div class="report-row">
            <span class="label">Total Amount</span>
            <span class="amount">₹{{ total_amount|floatformat:2 }}</span>
        </div>

        <div class="report-row">
            <span class="label">Total Discount</span>
            <span class="amount">₹{{ total_discount|floatformat:2 }}</span>
        </div>

        <div class="report-row">
            <span class="label">Total Advance Received</span>
            <span class="amount">₹{{ total_advance|floatformat:2 }}</span>
        </div>

        <div class="report-row">
            <span class="label">Total Pending Amount</span>
            <span class="amount">₹{{ total_pending|floatformat:2 }}</span>
        </div>

        <a href="{% url 'dashboard' %}" class="back-link">
            &larr; Back to Dashboard
        </a>
    </div>
</body>
</html>
