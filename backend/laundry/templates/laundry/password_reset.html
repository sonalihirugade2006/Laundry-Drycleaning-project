
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LaundryCare</title>
    <link rel="stylesheet" href="{% static 'laundry/style.css' %}?v=9">
</head>
<body>

    <header>
        <h1>LaundryCare</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/login/">Login</a>
        </nav>
    </header>

    <main class="form-container">
        <h2>Forgot Password?</h2>
        <p>Enter your registered email address. We will send you a password reset link.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="id_email">Email Address</label>
            <input
                type="email"
                name="email"
                id="id_email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">Send Reset Link</button>
        </form>

        <p>
            Remember your password?
            <a href="/login/">Login here</a>
        </p>
    </main>

</body>
</html>
