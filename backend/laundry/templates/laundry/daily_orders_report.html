
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Orders Report | LaundryCare</title>

    
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f0fdf4;
        margin: 0;
        padding: 35px 20px;
        color: #334155;
    }

    .container {
        width: 100%;
        max-width: 1000px;
        margin: auto;
        padding: 32px;
        background: #ffffff;
        border: 1px solid #d1fae5;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(6, 78, 59, 0.08);
    }

    h1 {
        color: #064e3b;
        text-align: center;
        font-size: 30px;
        font-weight: 800;
        margin: 0 0 10px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 15px;
        margin: 0 0 30px;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 24px;
        overflow: hidden;
        border: 1px solid #d1fae5;
        border-radius: 12px;
    }

    th,
    td {
        padding: 16px 14px;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
    }

    th {
        background: #065f46;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
    }

    td {
        font-size: 15px;
        color: #334155;
    }

    tbody tr:nth-child(even) {
        background: #f0fdf4;
    }

    tbody tr:hover {
        background: #dcfce7;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    .empty {
        text-align: center;
        padding: 26px;
        color: #64748b;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        margin-top: 26px;
        padding: 12px 18px;
        background: #047857;
        color: #ffffff;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.2s ease;
    }

    .back-link:hover {
        background: #065f46;
    }

    @media (max-width: 600px) {
        body {
            padding: 14px;
        }

        .container {
            padding: 18px 12px;
            overflow-x: auto;
        }

        h1 {
            font-size: 25px;
        }

        th,
        td {
            padding: 12px 9px;
            font-size: 13px;
        }
    }
</style>

</head>

<body>
    <div class="container">
        <h1>Daily Orders Report</h1>
        <p class="subtitle">LaundryCare Management System</p>

        <table>
            <thead>
                <tr>
                    <th>Sr. No.</th>
                    <th>Order Date</th>
                    <th>Total Orders</th>
                </tr>
            </thead>

            <tbody>
                {% for item in daily_orders %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ item.order_day|date:"d-m-Y" }}</td>
                    <td>{{ item.total_orders }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="empty">
                        No orders found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{% url 'dashboard' %}" class="back-link">
            &larr; Back to Dashboard
        </a>
    </div>
</body>
</html>
